<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宽基估值分位监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --buy: #16a34a; --buy-bg: #f0fdf4;
    --sell: #ea580c; --sell-bg: #fff7ed;
    --neutral: #475569;
    --line: #e2e8f0; --text: #0f172a; --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f8fafc; color: var(--text); padding: 24px 16px 48px; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header h1 { font-size: 22px; }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
           gap: 16px; margin-top: 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 { font-size: 16px; }
  .code { color: var(--muted); font-size: 12px; font-weight: normal; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.buy { background: var(--buy-bg); color: var(--buy); }
  .badge.sell { background: var(--sell-bg); color: var(--sell); }
  .badge.none { background: #f1f5f9; color: var(--neutral); }
  .badge.proxy { background: #fefce8; color: #a16207; }
  .pct { font-size: 34px; font-weight: 700; margin-top: 10px; }
  .pct small { font-size: 14px; font-weight: normal; color: var(--muted); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.7; }
  .tier { font-size: 13px; margin-top: 8px; }
  .tier.buy { color: var(--buy); } .tier.sell { color: var(--sell); }
  /* 分位进度条:三段底色 + 指针 */
  .bar { position: relative; height: 10px; border-radius: 5px; margin-top: 12px;
         background: linear-gradient(to right,
           var(--buy-bg) 0%, var(--buy-bg) 40%, #f1f5f9 40%, #f1f5f9 75%, var(--sell-bg) 75%); }
  .bar .mark { position: absolute; top: -3px; width: 2px; height: 16px; background: #94a3b8; }
  .bar .needle { position: absolute; top: -5px; width: 4px; height: 20px; border-radius: 2px;
                 background: var(--text); transition: left .4s; }
  section { margin-top: 32px; }
  section h3 { font-size: 15px; margin-bottom: 12px; }
  .chart-box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; height: 320px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line);
          border-radius: 12px; overflow: hidden; font-size: 13px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { background: #f8fafc; color: var(--muted); font-weight: 500; }
  td.dir-b { color: var(--buy); font-weight: 600; } td.dir-s { color: var(--sell); font-weight: 600; }
  .empty { background: #fff; border: 1px dashed var(--line); border-radius: 12px;
           padding: 40px; text-align: center; color: var(--muted); margin-top: 20px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; line-height: 1.8; }
  @media (max-width: 600px) { .pct { font-size: 28px; } table { font-size: 12px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>宽基估值分位监控</h1>
    <p id="updated">加载中…</p>
  </header>
  <div id="empty" class="empty" style="display:none">
    数据尚未生成。请先在 GitHub 仓库手动运行一次 Actions(workflow: valuation-monitor),
    运行成功后本页面会自动出现数据。
  </div>
  <div id="cards" class="cards"></div>
  <section>
    <h3>近一年分位走势(40% / 75% 阈值线)</h3>
    <div class="chart-box"><canvas id="chart"></canvas></div>
  </section>
  <section>
    <h3>信号历史</h3>
    <div id="signals"></div>
  </section>
  <footer>
    数据口径:四个指数均为蛋卷指数估值 PE 分位(近10年,与蛋卷估值页列表一致)。
    A股走势自系统上线日起记录;美股指数的历史走势同样自上线日起积累。
    页面数据随 GitHub Actions 每交易日更新一次,收盘后可见。本页面仅为监控提醒,不构成投资建议。
  </footer>
</div>

<script>
const fmt = (v, d = 1) => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(d);

async function getJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(url + ' ' + r.status);
  return r.json();
}

function card(it, th) {
  const pos = Math.min(100, Math.max(0, it.percentile));
  const zoneCls = it.zone === 'none' ? 'none' : it.zone;
  const tierHtml = it.tier
    ? `<div class="tier ${zoneCls}">${it.zone_label} · ${it.tier.label}:${it.tier.action}</div>`
    : `<div class="tier" style="color:var(--neutral)">${it.zone_label}(40%–75% 之间,不触发提醒)</div>`;
  const peTxt = it.pe != null ? `PE ${fmt(it.pe, 2)}` : '价格代理口径';
  return `
  <div class="card">
    <div class="top">
      <h2>${it.name} <span class="code">${it.code}</span></h2>
      <span style="display:flex;gap:4px">
        ${it.proxy ? '<span class="badge proxy">代理口径</span>' : ''}
        <span class="badge ${zoneCls}">${it.zone_label}</span>
      </span>
    </div>
    <div class="pct" style="color:${it.zone==='buy'?'var(--buy)':it.zone==='sell'?'var(--sell)':'var(--text)'}">
      ${fmt(it.percentile)}<small> 分位</small>
    </div>
    <div class="bar">
      <span class="mark" style="left:${th.buy}%"></span>
      <span class="mark" style="left:${th.sell}%"></span>
      <span class="needle" style="left:calc(${pos}% - 2px)"></span>
    </div>
    ${tierHtml}
    <div class="meta">${peTxt} · 数据日期 ${it.data_date || '—'}<br>
      ${it.source_label}${it.sample_size ? `(${it.sample_size} 样本)` : ''}</div>
  </div>`;
}

function signalsTable(rows) {
  if (!rows || !rows.length) return '<div class="empty">暂无信号。分位数跨越 40% / 75% 或档位加深时,这里会出现记录并推送提醒。</div>';
  const tr = rows.slice().reverse().map(r => `
    <tr>
      <td>${r.time || r.date}</td>
      <td>${r.name}</td>
      <td class="${r.direction === 'buy' ? 'dir-b' : 'dir-s'}">${r.direction_cn || r.direction}</td>
      <td>${r.tier}</td>
      <td>${r.action}</td>
      <td>${fmt(r.percentile)}%${r.prev_percentile != null ? `(前值 ${fmt(r.prev_percentile)}%)` : ''}</td>
    </tr>`).join('');
  return `<table><tr><th>时间</th><th>指数</th><th>方向</th><th>档位</th><th>建议</th><th>分位</th></tr>${tr}</table>`;
}

function drawChart(history, th, names) {
  if (!history || history.length < 2 || typeof Chart === 'undefined') return;
  const cutoff = new Date(Date.now() - 400 * 864e5).toISOString().slice(0, 10);
  const rows = history.filter(r => r.date >= cutoff);
  const labels = rows.map(r => r.date);
  const colors = ['#2563eb', '#16a34a', '#ea580c', '#9333ea'];
  const datasets = Object.keys(names).map((code, i) => ({
    label: names[code], data: rows.map(r => r[code] ?? null),
    borderColor: colors[i % colors.length], borderWidth: 2, pointRadius: 0, tension: .2,
    spanGaps: true,
  }));
  datasets.push(
    { label: `买入阈值 ${th.buy}%`, data: labels.map(() => th.buy), borderColor: '#16a34a',
      borderDash: [6, 4], borderWidth: 1, pointRadius: 0 },
    { label: `卖出阈值 ${th.sell}%`, data: labels.map(() => th.sell), borderColor: '#ea580c',
      borderDash: [6, 4], borderWidth: 1, pointRadius: 0 });
  new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } },
      plugins: { legend: { labels: { boxWidth: 14, font: { size: 11 } } } },
    },
  });
}

(async () => {
  try {
    const latest = await getJson('data/latest.json');
    const th = latest.thresholds;
    document.getElementById('updated').textContent =
      `更新于 ${latest.updated_at}(北京时间)· 每交易日收盘后自动更新`;
    document.getElementById('cards').innerHTML =
      latest.indices.map(it => card(it, th)).join('');
    const names = Object.fromEntries(latest.indices.map(i => [i.code, i.name]));
    const [history, signals] = await Promise.all([
      getJson('data/history.json').catch(() => []),
      getJson('data/signals.json').catch(() => []),
    ]);
    drawChart(history, th, names);
    document.getElementById('signals').innerHTML = signalsTable(signals);
  } catch (e) {
    document.getElementById('updated').textContent = '数据加载失败';
    document.getElementById('empty').style.display = '';
    console.error(e);
  }
})();
</script>
</body>
</html>
