name: valuation-monitor

on:
  schedule:
    - cron: '7,37 * * * 1-5'  # 每 30 分钟一条触发机会(分钟错开整点半点,避开 GitHub 调度高峰);
                              # GitHub 对新仓库的定时调度不可靠(实测连续丢失),靠多次机会兜底,
                              # 代码内自检窗口:仅北京时间 09:15–20:00 真正执行,其余秒退。
                              # 数据语义:蛋卷A股估值深夜发布、美股晨间更新,首次窗口内运行
                              # (约 09:37)即发当日日报,后续运行因幂等不重复推送。
  workflow_dispatch:

env:
  GITHUB_EVENT_NAME: ${{ github.event_name }}
    inputs:
      mode:
        description: '运行模式'
        type: choice
        default: normal
        options: [normal, test-push]

permissions:
  contents: write            # 提交状态与前端数据文件

concurrency:
  group: valuation-monitor
  cancel-in-progress: false  # 排队不丢弃,避免漏跑

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test-push" ]; then
            PYTHONPATH=src python -m valuation_alert.main --test-push
          else
            PYTHONPATH=src python -m valuation_alert.main
          fi

      - name: Commit state and docs data
        run: |
          git config user.name "valuation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/data/ || true
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push
