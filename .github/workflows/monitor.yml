name: valuation-monitor

on:
  schedule:
    - cron: '37 1 * * 1-5'     # UTC 01:37 = 北京时间 09:37,周一至周五
                               # 故意用非整点分钟:GitHub 定时任务在整点拥堵严重,
                               # 官方承认高峰延迟可达数小时甚至丢任务(2026-09-22 实测 02:00 整点未触发)
                               # 09:37 依据:蛋卷A股估值深夜发布(次晨就绪)、美股数据晨间更新
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        type: choice
        default: normal
        options: [normal, test-push]

permissions:
  contents: write            # 提交状态与前端数据文件

concurrency:
  group: valuation-monitor
  cancel-in-progress: false  # 排队不丢弃,避免漏跑

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test-push" ]; then
            PYTHONPATH=src python -m valuation_alert.main --test-push
          else
            PYTHONPATH=src python -m valuation_alert.main
          fi

      - name: Commit state and docs data
        run: |
          git config user.name "valuation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/data/ || true
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push
